version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodbridge-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword_secure_123}
      MYSQL_DATABASE: foodbridge_db
      MYSQL_USER: foodbridge
      MYSQL_PASSWORD: ${DB_PASSWORD:-foodbridge_prod_pass_123}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - foodbridge-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: foodbridge-backend:latest
    container_name: foodbridge-prod-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: foodbridge_db
      DB_USERNAME: foodbridge
      DB_PASSWORD: ${DB_PASSWORD:-foodbridge_prod_pass_123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - foodbridge-net
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: foodbridge-frontend:latest
    container_name: foodbridge-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - foodbridge-net

volumes:
  mysql_prod_data:
  uploads_data:

networks:
  foodbridge-net:
    driver: bridge
