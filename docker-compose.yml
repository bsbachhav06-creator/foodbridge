version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodbridge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: foodbridge_db
      MYSQL_USER: foodbridge
      MYSQL_PASSWORD: foodbridge_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: foodbridge-mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  mysql_data:
